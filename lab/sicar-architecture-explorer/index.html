    if (Tags("OpmodePanel_panel.panelClientCon.connectedMember[1].heartbeat").Read()) Tags("OpmodePanel_panel.panelClientCon.connectedMember[1].heartbeat").Write(false);
  break;
  case ipClient2 :
    if (Tags("OpmodePanel_panel.panelClientCon.connectedMember[2].heartbeat").Read()) Tags("OpmodePanel_panel.panelClientCon.connectedMember[2].heartbeat").Write(false);
  break;
  case ipClient3 :
    if (Tags("OpmodePanel_panel.panelClientCon.connectedMember[3].heartbeat").Read()) Tags("OpmodePanel_panel.panelClientCon.connectedMember[3].heartbeat").Write(false);
  break;
  default: //Handle the sign up and access denied pop up
    let accessDenied = Tags("OpmodePanel_panel.panelClientCon.currentData.accessDenied").Read();
    let currentLocalIp = Tags("OpmodePanel_panel.panelClientCon.currentData.ipLocal").Read();
    let accessDenPopUp = Tags("accessDenPopupOpen").Read();
    //If the PLC don't denie the access to the runtime, the client is writting it's own LocalMachineName to the PLC interface
    if (! accessDenied && ! accessDenPopUp) {
      Tags("OpmodePanel_panel.panelClientCon.currentData.ipLocal").Write(machineName);
    } else if (accessDenied && ! accessDenPopUp && (machineName == currentLocalIp)) {   //When no client slot is empty, PLC is set the accessDenied to TRUE and denie the runtimecontrol
      module_navigation.OpenPopupWindow("100_AccessDenied");
      Tags("OpmodePanel_panel.panelClientCon.currentData.ipLocal").Write('');
    }
  break;
}

_V52/UserDocumentation/SICAR_Global/SICAR_GettingStarted_V5.2.pdf`,where:`§3.13 · printed pp. 49–50`,note:`Documents GraphControl in permanent pre-instructions, the advanced extension block, and singleStepActive / singleStepPlus in the OpMode output interface.`},{id:`concept`,title:`Function versus hardware`,file:sr+`SICAR_Guidelines2026/SICAR_AutomationSoftware_v41.pdf`,where:`§4.2–4.5 · printed pp. 9–14`,note:`Describes OpMode ownership, software units, the ISA-88 structuring idea, TecUnits with Unified objects, and hardware-specific drivers.`},{id:`packages`,title:`Demo versus StartUp`,file:sr+`SICAR_Doku_V52/UserDocumentation/SICAR_Global/SICAR_GettingStarted_V5.2.pdf`,where:`§1 · printed p. 5`,note:`StartUp provides the basic configuration. Demo includes application samples. Supplied ProjectInfo.txt files confirm both projects are V21.`},{id:`block`,title:`Station and lifter block interfaces`,file:sr+`SICAR_Doku_V52/UserDocumentation/Library Types/LSicar_StationInterface.htm`,where:`Code2Docu · Library Types`,note:`Verified against LSicar_StationInterface.htm and LSicar_Lifter2S2D2P.htm. The animation uses an illustrative lifter, not a reproduction of the supplied GRAPH logic.`}],lr={hmi:{name:`WinCC Unified HMI`,kicker:`OPERATOR VIEW`,body:`The operator sees the same equipment model that the PLC controls: OpMode areas, stations and TecUnit faceplates.`,facts:[`Core screens provide navigation and an overview of OpMode status.`,`A TecUnit FB has corresponding Unified HMI objects.`,`Panel ownership and client authority matter for manual commands.`],takeaway:`A standard function includes a standard way to operate and diagnose it.`,source:`concept`},global:{name:`GlobalData`,kicker:`SHARED INTERFACES`,body:`The central data household. Global DBs and PLC tag tables provide defined exchange points between software units and the HMI.`,facts:[`OpmodePanel is present in both supplied projects.`,`Station exchange DBs can be placed here; the actual demo also has station-local StIf DBs.`,`A TIA Relation grants access to another unit; it does not call a block.`],takeaway:`Separate where information is exchanged from where the process is controlled.`,source:`structure`},central:{name:`CentralFunctions`,kicker:`CROSS-AREA SERVICES`,body:`Functions used across several operating areas live together rather than being repeated in each station.`,facts:[`Initialisation and panel management are documented central responsibilities.`,`Diagnostics and production-related common functions sit alongside them.`,`The demo readback contains relations to GlobalData, Library and Safety.`],takeaway:`One shared service can support many independent OpMode areas.`,source:`structure`},opmode:{name:`OpMode area`,kicker:`OPERATING OWNERSHIP`,body:`A section of the machine that owns its operating behaviour. Its software unit contains process logic, sequences, TecUnits, drivers and interfaces.`,facts:[`LSicar_Opmode manages operating behaviour.`,`The main cyclic OB calls the area call block in the documented pattern.`,`Demo has OpmodeArea1–7; StartUp has OpmodeArea1.`],takeaway:`Define the boundary by operating responsibility, then organise its stations inside it.`,source:`station`},station:{name:`Station`,kicker:`PROCESS ORGANISATION`,body:`A station groups the sequence and control functions for one section of an OpMode area. A station is not automatically a separate software unit.`,facts:[`Each station has its own sequence and TecUnits in the documented design.`,`LSicar_StationInterface manages TecUnits within the station.`,`StartUp contains Control1, StartUpSequence1 and StIf1.`],takeaway:`An OpMode area can contain several stations without duplicating its mode manager.`,source:`station`},tecunit:{name:`TecUnit`,kicker:`REUSABLE FUNCTION`,body:`A software representation of a physical function: lifting, conveying, valve movement or a binary device. It describes what the equipment does.`,facts:[`Represented by an FB plus corresponding Unified HMI objects.`,`LSicar_Lifter2S2D2P exists in the supplied demo Library unit.`,`Functionality is separated from the specific drive or sensor hardware.`],takeaway:`Reuse the function when the hardware changes; adapt and verify the interface and driver.`,source:`concept`},driver:{name:`Driver`,kicker:`HARDWARE ADAPTATION`,body:`The driver controls the specific device and translates between the functional equipment model and physical hardware.`,facts:[`The guideline uses a SINAMICS G120 as an example of physical hardware.`,`Changing a drive does not necessarily mean rewriting the process sequence.`,`Interfaces, readiness, feedback and diagnostics still need application-specific verification.`],takeaway:`The TecUnit owns the function. The driver owns the hardware-specific implementation.`,source:`concept`},library:{name:`Library`,kicker:`SHARED BUILDING BLOCKS`,body:`The software unit that provides reusable types, FBs and data types to the other software units.`,facts:[`Contains LSicar types, including TecUnits and operating-mode blocks.`,`It provides building blocks; process instances are owned by the application.`,`The supplied demo also has a Library → Safety relation.`],takeaway:`Keep a reusable block type separate from the station instance using it.`,source:`structure`},safety:{name:`Safety`,kicker:`SEPARATE RESPONSIBILITY`,body:`The safety programme lives in its own software unit. In the guideline it is optional when no safety programme is used, and only one Safety unit is allowed per PLC.`,facts:[`Both supplied projects contain a Safety software unit.`,`Neither readback shows an outgoing relation from Safety.`,`Other units access defined safety interfaces; a standard mode manager is not the safety programme.`],takeaway:`Status exchange does not transfer the responsibility of the safety programme.`,source:`concept`},field:{name:`Physical equipment`,kicker:`THE REAL MACHINE`,body:`Sensors, actuators and drives turn the software function into movement and feedback.`,facts:[`Process commands travel towards equipment; feedback returns towards the controller and HMI.`,`The guide illustrates this direction, not PLC scan order or network timing.`,`No PLC connection is used by this learning artifact.`],takeaway:`Trace a function all the way from the operator request to physical feedback.`,source:`concept`}};function N({name:e,size:t=21}){let n={map:(0,M.jsxs)(M.Fragment,{children:[(0,M.jsx)(`rect`,{x:`3`,y:`3`,width:`6`,height:`6`}),(0,M.jsx)(`rect`,{x:`15`,y:`15`,width:`6`,height:`6`}),(0,M.jsx)(`rect`,{x:`15`,y:`3`,width:`6`,height:`6`}),(0,M.jsx)(`path`,{d:`M6 9v9h9M9 6h6`})]}),station:(0,M.jsxs)(M.Fragment,{children:[(0,M.jsx)(`rect`,{x:`3`,y:`15`,width:`18`,height:`5`}),(0,M.jsx)(`path`,{d:`M6 15V4h12v11M9 9h6M12 9v6`})]}),operation:(0,M.jsxs)(M.Fragment,{children:[(0,M.jsx)(`path`,{d:`M5 5h14M5 12h14M5 19h14`}),(0,M.jsx)(`circle`,{cx:`9`,cy:`5`,r:`2`}),(0,M.jsx)(`circle`,{cx:`16`,cy:`12`,r:`2`}),(0,M.jsx)(`circle`,{cx:`8`,cy:`19`,r:`2`})]}),projects:(0,M.jsxs)(M.Fragment,{children:[(0,M.jsx)(`path`,{d:`M3 7h7l2-3h9v16H3Z`}),(0,M.jsx)(`path`,{d:`M7 12h10M7 16h7`})]}),sources:(0,M.jsxs)(M.Fragment,{children:[(0,M.jsx)(`path`,{d:`M5 3h10l4 4v14H5Z`}),(0,M.jsx)(`path`,{d:`M14 3v5h5M8 12h8M8 16h6`})]}),arrow:(0,M.jsx)(`path`,{d:`M4 12h16m-6-6 6 6-6 6`}),play:(0,M.jsx)(`path`,{d:`m8 4 12 8-12 8Z`}),pause:(0,M.jsx)(M.Fragment,{children:(0,M.jsx)(`path`,{d:`M8 4v16M16 4v16`})}),check:(0,M.jsx)(`path`,{d:`m5 12 4 4L19 6`}),close:(0,M.jsx)(`path`,{d:`m6 6 12 12M18 6 6 18`}),layers:(0,M.jsx)(M.Fragment,{children:(0,M.jsx)(`path`,{d:`m12 3 10 5-10 5L2 8Zm-9 10 9 5 9-5M3 18l9 4 9-4`})})};return(0,M.jsx)(`svg`,{width:t,height:t,viewBox:`0 0 24 24`,fill:`none`,stroke:`currentColor`,strokeWidth:`1.5`,strokeLinecap:`round`,strokeLinejoin:`round`,"aria-hidden":`true`,children:n[e]||n.layers})}function ur({children:e,onClick:t,secondary:n=!1,disabled:r=!1}){return g.createElement(`ix-button`,{variant:n?`secondary`:`primary`,onClick:t,disabled:r?``:void 0},e)}functi
