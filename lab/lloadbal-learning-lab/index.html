 45  Converts an unscaled value to a scaled value using the specified reference value.

 47  END_REGION DESCRIPTION
 48
 49  IF (#dataType = #INTEGER) THEN
 50  #LLoadBal_ScaleValue := DINT_TO_LREAL(#value) / #NORMALIZATION_VALUE_INT * #referenceValue;
 51  ELSIF (#dataType = #DOUBLE_INTEGER) THEN
 52  #LLoadBal_ScaleValue := DINT_TO_LREAL(#value) / #NORMALIZATION_VALUE_DINT * #referenceValue;
 53  ELSE
 54  #LLoadBal_ScaleValue := 0.0;
 55  END_IF;
 56  END_FUNCTION`,explanation:"DInt signals are normalised by 16#40000000, then multiplied by the configured reference value. This is why a raw telegram number is not a torque in Nm."},{id:"smooth",title:"Smooth and compare",path:"Demo project snapshots/LLoadBal_V1_1_0_V21\\Vci\\Software PLC\\Program blocks\\LLoadBal_Blocks\\LLoadBal_FollowingAxis.scl",sha256:"f740b057e56b7736f6c58b52cdabc3bedf174332192c2751af0abd3a4a53f02c",modified:"2026-10-09T11:30:52.528Z",start:335,end:350,snippet:`335

338
339  // Smooth torque setpoint of leading axis
340  #statInternalPT1ValueLeadingAxis := #statInternalPT1ValueLeadingAxis + (#dataLeadingAxis.torqueSetpoint - #statInternalPT1ValueLeadingAxis) * (#statLoadBalancingController.cycleTime * 1000.0 / 10.0);

344
345  // Create setpoint and actual value of controller
346  #statLoadBalancingController.setpointValue := #statInternalPT1ValueLeadingAxis;
347  #statLoadBalancingController.actualValue   := #statInternalPT1ValueFollowingAxis + (#tensionTorque * -1.0);
