FUNCTION Grip : VOID

  writeVar( OpenGripper, TRUE);
  waitEvent( GripperOpened );

`,_r=`PROGRAM main
  // global interpreter tags are visible for each program organization unit of an interpreter program
  VAR_IPR
    PartCounter : DINT;
    AbovePlacePos : TO_Struct_Ipr_Position := (x:=652.748, z:=790.0, a:=0.0);
    PlacePos : TO_Struct_Ipr_Position := (x:=652.748, z:=589.17, a:=0.0);
  END_VAR

  // declare global interpreter constants in the main program
  VAR_IPR CONSTANT
    InitPos : TO_Struct_Ipr_Position := ( x := 616.673, y := -228.487, z := 790.0, a := 0.0);
    ConveyorApproachPos : TO_Struct_Ipr_Position := (x:=-200.0, y:= -626.0, z:=670.0);
    ConveyorStartPos : TO_Struct_Ipr_Frame:= (x:=-350.0, y:=-626.0, z:=572.0);
    ProdBeltVelocity : LREAL := 180.0;
    ContainerBeltVelocity : LREAL := 700.0;
    ProductOffset : LREAL := -114.598;
    ProductWidth : LREAL := 120;
  END_VAR

  INIT();

  // Move to inital position
  ptpAbs( InitPos );

  // set lightstack to Green
  writeVar( StackLightGreen, TRUE );
  writeVar( StackLightOrange, FALSE );
  writeVar( StackLightRed, FALSE );

  // loop until cycle end is set
  WHILE $IPR.Clipboard.CbBool[100] = FALSE DO
    SEQ_PROD_BELT();
    // Apply cover and start transport when container is full
    IF PartCounter = 3 THEN
      APPLY_COVER();
      SEQ_CONT_BELT();
    END_IF;
  END_WHILE;

  // powerOff kinematics and conveyor axes at cycle end
  powerOff( mode := 3 );
  powerOff( axis := ProdBelt, mode := 3 );
  powerOff( axis := ContBelt, mode := 3);
END_PROGRAM


FUNCTION INIT : VOID
  // set lightstack to Orange during initalization
  writeVar( StackLightGreen, FALSE );
  writeVar( StackLightOrange, TRUE );
  writeVar( StackLightRed, FALSE );

  // Power on the kinematics and conveyor axes
  powerOn( );
  powerOn(axis:= ProdBelt);
  powerOn(axis:= ContBelt);

  // Spawn an inital product on the ProductBelt
  writeVar( SpawnProduct, TRUE);

  // Instatiate an initial container in the NX MCD model
  IF ContPackingSensor = FALSE THEN
    writeVar( SpawnContainer, TRUE);
    waitTime( T#400ms );
    writeVar( SpawnContainer, FALSE);
  END_IF;
  // Proceed when container has been created
  waitEvent(ContPackingSensor);
  $IPR.Clipboard.CbBool[1]:= FALSE; // ContainerPacked = FALSE

  // Initilize gripper to open position
  GripperGrip := FALSE;
  GripperRelease := TRUE;
  waitEvent(GripperNotGripped);

  // Demo application starts with 0 products packed
  PartCounter:=0;
END_FUNCTION

FUNCTION SEQ_PROD_BELT : VOID
  VAR
    PlacePosY : LREAL; // local variable for y position offset calculation
  END_VAR
  setTrans( 2 ); // set motion transition mode modally
  setBlend( 2 ); // set blending mode modally

  // calculate and assign y position for current product

  AbovePlacePos.y := PlacePosY;
  PlacePos.y := PlacePosY;

  linAbs( ConveyorApproachPos );
  writeVar(SpawnProduct,FALSE);
  waitEvent( ContPackingSensor );

  // start the conveyor + tracking, approach the product and grip it
  move( ProdBelt, ProdBeltVelocity);
  trackIn( ProdBelt, ConveyorStartPos, initPos := (x:=ProdBelt.ActualPosition) );
  linAbs( (x:=0.0, z:=100.0), cs := 1 );
  linAbs( (x:=0.0, z:=0.0), v := 150.0, cs := 1 );
  writeVar( GripperRelease, FALSE);
  writeVar(GripperGrip, TRUE);
  waitEvent(GripperGripped);

  // lift the product, desynchronize from the conveyor and place the product
  linRel( (z:=100.0), v := 150.0, cs := 1 );
  linAbs( AbovePlacePos, v := 350.0, cs := 0 );
  linAbs( PlacePos );
  writeVar(GripperRelease,TRUE);
  writeVar(GripperGrip,FALSE);
  waitEvent(GripperNotGripped);

  // stop the product belt
  move( ProdBelt, 0.0);

  // create a new product and increas PartCounter
  writeVar( SpawnProduct, TRUE);
  PartCounter := PartCounter + 1;

  // lift off SCARA of container belt
  linRel((x:=0.0, y:=0.0, z:=29.0, a:=0.0));
END_FUNCTION

FUNCTION APPLY_COVER : VOID
  setTrans( 2 );
  setBlend( 2 );
  ptpAxAbs( (a1:=130.0, a2:=-95.0, a3:=-50.0, a4:=55.0) );
  ptpAxRel( (a3:=-80.0) );

  writeVar( GripperRelease, FALSE);
  writeVar(GripperGrip, TRUE);
  waitEvent(GripperGripped);
  ptpAxAbs((a3:=0.0));
  linAbs( (x:=648.748, y:=0, z:=790.0, a:=0.0), cs := 0 );
  linRel( (z:=-130.0) );

  writeVar( GripperRelease, TRUE);
  writeVar(GripperGrip, FALSE);
  waitEvent(GripperNotGripped);

  ptpAbs( InitPos, lc := 0 );

  PartCounter := 0;
  $IPR.Clipboard.CbBool[1]:= TRUE; //ContainerPacked := TRUE;

END_FUNCTION

FUNCTION SEQ_CONT_BELT : VOID
  waitEvent( ContAtPalletizingSensorFalse );
  waitEvent($IPR.Clipboard.CbBool[1]); // Proceed when container is packed
  move(ContBelt, ContainerBeltVelocity);
  $IPR.Clipboard.CbBool[1]:= FALSE;     // ContainerPacked := FALSE;
  waitEvent( ContAtPalletizingSensor );
  move(ContBelt, 0.0);
  writeVar( SpawnContainer, TRUE);
  waitTime( T#400ms );
  writeVar( SpawnContainer, FALSE);
END_FUNCTION
