<!-- ============================================================
     S2 — THREE TECHNOLOGY OBJECTS
     ============================================================ -->
<section class="section" id="s2">
  <div class="wrap">
    <p class="eyebrow">Architecture</p>
    <h2>Three technology objects</h2>
    <p class="section-intro">The Interpreter is implemented as a technology object and is controlled from the user program. Click any block below to read what it does.</p>

    <div class="diagram-panel">
      <svg class="to-diagram" viewBox="0 0 960 460" role="group" aria-label="Interpreter architecture diagram" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="mk-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" class="mk-fill-control"></path>
          </marker>
          <marker id="mk-motion" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" class="mk-fill-motion"></path>
          </marker>
          <marker id="mk-status" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" class="mk-fill-status"></path>
          </marker>
          <marker id="mk-feed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" class="mk-fill-feed"></path>
          </marker>
        </defs>

        <!-- static feed lines (program/mapping into interpreter) -->
        <path class="feed-line" d="M375,80 L375,120" marker-end="url(#mk-feed)"></path>
        <path class="feed-line" d="M545,80 L470,120" marker-end="url(#mk-feed)"></path>

        <!-- animated flow connectors -->
        <path class="flow-line control" d="M212,200 C255,200 262,258 300,258" marker-end="url(#mk-control)"></path>
        <path class="flow-line motion" d="M620,215 C642,215 646,182 660,182" marker-end="url(#mk-motion)"></path>
        <path class="flow-line motion" d="M620,330 C642,330 646,340 660,340" marker-end="url(#mk-motion)"></path>
        <path class="flow-line status" d="M340,398 C300,440 250,440 214,384" marker-end="url(#mk-status)"></path>

        <!-- TO_InterpreterProgram -->
        <g class="to-box" id="box-program" tabindex="0" role="button" aria-pressed="false" aria-label="TO_InterpreterProgram">
          <rect x="300" y="16" width="150" height="64" rx="4"></rect>
          <text x="375" y="40" text-anchor="middle" class="box-title">TO_InterpreterProgram</text>
          <text x="375" y="58" text-anchor="middle" class="box-sub">holds the MCL program</text>
        </g>

        <!-- TO_InterpreterMapping -->
        <g class="to-box" id="box-mapping" tabindex="0" role="button" aria-pressed="false" aria-label="TO_InterpreterMapping">
          <rect x="470" y="16" width="150" height="64" rx="4"></rect>
          <text x="545" y="40" text-anchor="middle" class="box-title">TO_InterpreterMapping</text>
          <text x="545" y="58" text-anchor="middle" class="box-sub">declares what MCL may reach</text>
        </g>

        <!-- User program -->
        <g class="to-box" id="box-user" tabindex="0" role="button" aria-pressed="false" aria-label="User program, cyclic OB">
          <rect x="16" y="120" width="196" height="300" rx="4"></rect>
          <text x="114" y="144" text-anchor="middle" class="box-title">User program</text>
          <text x="114" y="160" text-anchor="middle" class="box-sub">cyclic OB</text>
          <rect class="call-block" x="30" y="176" width="168" height="46" rx="2"></rect>
          <text x="114" y="203" text-anchor="middle" class="call-block-text">MC_LoadProgram</text>
          <rect class="call-block" x="30" y="230" width="168" height="46" rx="2"></rect>
          <text x="114" y="257" text-anchor="middle" class="call-block-text">MC_RunProgram</text>
          <rect class="call-block" x="30" y="284" width="168" height="46" rx="2"></rect>
          <text x="114" y="311" text-anchor="middle" class="call-block-text">MC_StopProgram</text>
          <rect class="call-block" x="30" y="338" width="168" height="46" rx="2"></rect>
          <text x="114" y="365" text-anchor="middle" class="call-block-text">Status evaluation</text>
        </g>

        <!-- TO_Interpreter (centre) -->
        <g class="to-box is-selected" id="box-interpreter" tabindex="0" role="button" aria-pressed="true" aria-label="TO_Interpreter">
          <rect x="300" y="120" width="320" height="300" rx="4"></rect>
          <text x="460" y="144" text-anchor="middle" class="box-title">TO_Interpreter</text>
          <rect class="call-block" x="316" y="170" width="288" height="108" rx="2"></rect>
          <text x="460" y="200" text-anchor="middle" class="call-block-text">Program preparation</text>
          <text x="460" y="220" text-anchor="middle" class="box-sub">MC_LookAhead OB</text>
          <rect class="call-block" x="316" y="288" width="288" height="108" rx="2"></rect>
          <text x="460" y="318" text-anchor="middle" class="call-block-text">Sequential program execution</text>
          <text x="460" y="338" text-anchor="middle" class="box-sub">MC_Interpolator OB</text>
        </g>

        <!-- TO_Kinematics -->
        <g class="to-box" id="box-kinematics" tabindex="0" role="button" aria-pressed="false" aria-label="TO_Kinematics">
          <rect x="660" y="120" width="284" height="140" rx="4"></rect>
          <text x="802" y="150" text-anchor="middle" class="box-title">TO_Kinematics</text>
          <text x="802" y="170" text-anchor="middle" class="box-sub">up to 6 interpolating axes</text>
          <rect class="call-block" x="676" y="186" width="252" height="58" rx="2"></rect>
          <text x="802" y="220" text-anchor="middle" class="call-block-text">motion jobs executed</text>
        </g>

        <!-- Mapped axes -->
        <g class="to-box" id="box-axes" tabindex="0" role="button" aria-pressed="false" aria-label="Mapped axes: Speed, Positioning, Synchronous">
          <rect x="660" y="280" width="284" height="140" rx="4"></rect>
          <text x="802" y="310" text-anchor="middle" class="box-title">Mapped axes</text>
          <text x="802" y="330" text-anchor="middle" class="box-sub">Speed &middot; Positioning &middot; Synchronous</text>
          <rect class="call-block" x="676" y="346" width="252" height="58" rx="2"></rect>
          <text x="802" y="380" text-anchor="middle" class="call-block-text">MC_Interpolator (cyclic)</text>
        </g>
      </svg>

      <div class="line-legend" aria-hidden="true">
        <span class="sw"><i style="background:var(--ix-primary);border:none;width:14px;height:3px;border-radius:2px;"></i>control &mdash; user program &rarr; interpreter</span>
        <span class="sw"><i style="background:var(--ix-dynamic-alt);border:none;width:14px;height:3px;border-radius:2px;"></i>motion &mdash; interpreter &rarr; kinematics / axes</span>
        <span class="sw"><i style="background:var(--ix-neutral);border:none;width:14px;height:3px;border-radius:2px;"></i>status &mdash; interpreter &rarr; user program</span>
      </div>

      <div class="diagram-detail" id="diagramDetail">
        <!-- filled by JS from a data table; default = TO_Interpreter -->
      </div>
    </div>
  </div>
</section>
