<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cosmos 3 · From context to prediction</title>
<style>:root{font:16px/1.6 "Segoe UI",Arial,sans-serif;color:#182e27;background:#f3f5ee;--line:#d4ded0;--muted:#53645a;--panel:#fff;--ar:#59471c;--ar-bg:#f9f0d8;--dm:#135e56;--dm-bg:#e7f5ee;--ink:#152f26}*{box-sizing:border-box}body{margin:0}a{color:#07624f;text-underline-offset:.2em}button,input{font:inherit}button{border:1px solid #9aaca1;background:#fff;border-radius:6px;color:var(--ink);padding:8px 13px;min-height:44px;cursor:pointer}button:disabled{opacity:.52;cursor:default}button:hover:not(:disabled){background:#ecf4e6}button.primary{background:#175e47;color:#fff;border-color:#175e47}button.primary:hover:not(:disabled){background:#124b39}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #a25812;outline-offset:3px}.skip{position:fixed;z-index:10;top:-80px;left:15px;background:white;padding:12px}.skip:focus{top:10px}.mast{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px max(5vw,20px);border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.10em}.mast-tag,.offline{color:var(--muted)}.mark{display:inline-block;width:13px;height:13px;background:#507735;margin-right:10px;vertical-align:-1px;transform:rotate(45deg)}main{width:min(1130px,calc(100% - 44px));margin:auto}.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:60px;align-items:end;padding:60px 0 34px}.hero h1{font:400 clamp(46px,8vw,88px)/.98 Georgia,serif;letter-spacing:-.05em;margin:12px 0 24px}.lead{color:var(--muted);font-size:clamp(17px,2vw,23px);margin:0}.hero-note{padding:20px 0 2px 22px;border-left:3px solid #8fa767;align-self:end}.hero-note p{margin:.4rem 0 0}.kicker{font-size:11px;font-weight:800;letter-spacing:.11em;color:#385d45}.hero .kicker{margin:0}nav{display:flex;flex-wrap:wrap;gap:10px 24px;border-block:1px solid var(--line);padding:14px 0;margin-bottom:32px}nav a{font-weight:600;font-size:14px}section{padding:30px 0;border-bottom:1px solid var(--line);scroll-margin-top:15px}h2{font:400 clamp(28px,4vw,43px)/1.14 Georgia,serif;margin:6px 0 12px}h3{font-size:19px;line-height:1.28;margin:4px 0 10px}p,li,dd{overflow-wrap:break-word}.intro{max-width:820px;color:var(--muted);margin-top:0}.architecture,.lab{background:var(--panel);border:1px solid var(--line);margin:22px 0;padding:24px;border-radius:10px}.architecture{border-top:4px solid #557d41}.arch-grid{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);gap:9px 10px;grid-template-areas:"source . gensrc" "down . genDown" "reason cross maker" "text . output"}.arch-box,.tower{padding:14px 17px;border:1px solid var(--line);border-radius:7px}.arch-box{background:#f6f8f4}.arch-box span{display:block;font-size:14px;color:var(--muted)}.source-box{grid-area:source}.gen-source{grid-area:gensrc}.down.gen-down{grid-area:genDown}.down{grid-area:down;margin:auto;font-size:23px}.cross{grid-area:cross;display:grid;place-content:center;justify-items:center;line-height:1.25;color:#14715f;gap:5px;text-align:center}.cross small{font-size:12px}.cross .horizontal,.cross .vertical{font-size:25px;line-height:.9}.cross .vertical{display:none}.tower.ar{grid-area:reason;background:var(--ar-bg);border-color:#d7c391;color:var(--ar)}.tower.dm{grid-area:maker;background:var(--dm-bg);border-color:#a9cbbb;color:var(--dm)}.tower p{margin:0 0 9px;font-size:15px}.tower ol{margin:0;padding-left:22px;font-size:14px}.ar-result{grid-area:text}.dm-result{grid-area:output}.architecture figcaption{border-top:1px solid var(--line);margin-top:19px;padding-top:14px;font-size:14px;color:var(--muted)}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.pair article{background:white;border:1px solid var(--line);border-left:3px solid #a6bc89;padding:18px 21px}.pair article p:last-child{margin-bottom:0}.technical{margin-top:20px}.lab-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px;font-size:13px;color:var(--muted)}.flowline{display:grid;grid-template-columns:1fr minmax(120px,.34fr);gap:10px;margin:15px 0}.flowline>div,.mask-detail{background:#edf4ea;border:1px solid #d9e4d6;border-radius:6px;padding:14px}.flowline p{margin:.3rem 0 0}.next-token{font:700 20px Consolas,monospace;color:var(--dm)}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{color:var(--muted);font-size:14px;margin:12px 0 0}.annotation{background:#e7efe2;border-left:4px solid #6e9157;padding:15px 19px;margin-top:16px}.annotation p{margin:.4rem 0 0}.lab fieldset{border:0;padding:0;margin:16px 0;display:flex;flex-wrap:wrap;gap:8px 16px}.lab legend{font-weight:700;margin-bottom:6px}.lab label{padding:6px 1px;display:inline-flex;align-items:center;gap:5px}.lab input{accent-color:#175e47}.mask-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:17px;align-items:start}.mask{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed;text-align:center}.mask caption{font-weight:700;text-align:left;font-size:14px;margin-bottom:5px}.mask th{font-size:13px}.mask th:first-child{width:64px}.mask td{background:#f3f4f0;font-weight:700;border:1px solid transparent;height:37px}.mask td.ok{background:#dcebd9;color:#185b42}.mask td.blocked{color:#7d4930;background:#f5eee5}.mask .active td{border-color:#1c6651}.mask button{padding:3px;width:100%;font-size:13px;min-height:38px}.mask button[aria-pressed=true]{background:#175e47;color:#fff}.mask-detail p:last-child{margin-bottom:0}dl{margin:0}dt{font-weight:700}dd{margin:0 0 8px}details{padding:16px 19px;margin-top:18px;background:#fff;border:1px solid var(--line)}summary{cursor:pointer;font-weight:700}.equations{display:grid;gap:5px;margin:10px 0}code{font-family:Consolas,monospace;overflow-wrap:anywhere}.equations code{background:#edf4ea;padding:8px 11px}.sources{padding-left:22px}.sources li{margin:8px 0}footer{width:min(1130px,calc(100% - 44px));margin:0 auto;padding:18px 0 35px;color:var(--muted);font-size:13px}@media(max-width:700px){.hero{grid-template-columns:1fr;gap:20px;padding-top:36px}.mast-tag{display:none}.pair,.mask-layout{grid-template-columns:1fr}.architecture,.lab{padding:15px}.arch-grid{grid-template-columns:1fr;grid-template-areas:"source" "down" "reason" "text" "gensrc" "cross" "maker" "output"}.down.gen-down{display:none}.cross .vertical{display:block}.cross .horizontal{display:none}.cross{padding:11px 0}.hero-note{padding-top:8px}.nav{gap:8px 16px}}@media(max-width:420px){main,footer{width:calc(100% - 30px)}.flowline{grid-template-columns:1fr}.mast{padding-inline:15px}.mask th:first-child{width:48px}}
.denoise-lab{scroll-margin-top:16px}
.denoise-lab h3{margin:16px 0 8px}
.denoise-actions{margin:14px 0 19px}
.denoise-layout{display:grid;grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr);align-items:stretch;gap:10px}
.denoise-card{border:1px solid var(--line);border-radius:7px;padding:14px 16px;min-width:0}
.denoise-cache{background:#f9f0d8;border-color:#d7c391}
.denoise-generator{background:#e7f5ee;border-color:#a9cbbb}
.denoise-card h4{font-size:19px;line-height:1.2;margin:6px 0 10px}
.denoise-card p{margin:10px 0 0}
.denoise-symbols{display:flex;gap:6px;flex-wrap:wrap}
.denoise-symbols code{font-weight:700;border:1px solid #c1c0ad;background:#fff9;padding:1px 7px;border-radius:4px}
.denoise-tag{font-size:13px;font-weight:700;color:#405643}
.denoise-link{display:grid;align-content:center;justify-items:center;gap:5px;font-size:12px;font-weight:700;text-align:center;color:#4a685a}
.denoise-link.reading{color:#08604b}
.denoise-link small{font-weight:400}
.denoise-track{position:relative;inline-size:100%;height:26px;color:inherit}
.denoise-track:before{content:"";position:absolute;background:currentColor;height:2px;top:50%;left:5%;right:12%;opacity:.55}
.denoise-arrow,.denoise-down{position:absolute;right:0;top:0;font:23px/26px "Segoe UI",sans-serif}
.denoise-down{display:none}
.denoise-track i{position:absolute;top:calc(50% - 4px);left:calc(5% + 78% * var(--travel,.5));width:9px;height:9px;background:#087b59;border:1px solid white;border-radius:50%}
.denoise-target{background:#f3f7ef;border:1px solid #d9e4d6;margin-top:16px;padding:12px}
.aisle-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.aisle-strip>div{min-width:0}
.aisle-strip span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.aisle-frame{display:block;width:100%;height:auto;border-radius:4px}
.aisle-frame g{transition:opacity .46s ease-out}
.denoise-status{background:#eef4ea;border-left:3px solid #668c59;margin-top:14px;padding:9px 12px}
.denoise-status p{margin:3px 0 0}
@media(max-width:700px){.denoise-layout{grid-template-columns:1fr;gap:7px}.denoise-link{grid-template-columns:1fr 28px 1fr;align-items:center;justify-items:center}.denoise-track{width:28px;height:47px}.denoise-track:before{width:2px;height:auto;top:4px;bottom:8px;left:calc(50% - 1px);right:auto}.denoise-track i{top:calc(5% + 69% * var(--travel,.5));left:calc(50% - 4px)}.denoise-arrow{display:none}.denoise-down{display:block;top:auto;bottom:0;right:7px}}
@media(prefers-reduced-motion:reduce){.aisle-frame g{transition:none}}

#attention-mask,#attention-equations{scroll-margin-top:16px}
#attention-mask h3{margin-top:12px}
.mask-positions{display:flex;flex-wrap:wrap;gap:5px 9px;padding:0;margin:12px 0 0;list-style:none}
.mask-positions li{font-size:13px;background:#f1f5ee;border:1px solid var(--line);padding:3px 7px;border-radius:4px}
.mask.scanning .active .ok{animation:mask-read .72s var(--scan-delay) ease-out}
@keyframes mask-read{35%{background:#27795e;color:white;box-shadow:inset 0 0 0 2px #123d30}}
.equations{grid-template-columns:minmax(0,1fr);gap:7px}
.equation{overflow-x:auto;background:#edf4ea;border-radius:4px;padding:8px 10px}
.equation math{width:max-content;min-width:100%;font-size:clamp(.86rem,2.4vw,1.22rem)}
@media(prefers-reduced-motion:reduce){.mask.scanning .active .ok{animation:none}}
</style>
