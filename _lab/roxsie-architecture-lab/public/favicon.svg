<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ROXSIE Architecture Lab" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ROXSIE Architecture Lab</title>
  <!-- The page's own signature mark: a six-segment lifetime buffer with the
       just-published segment lit. Siemens petrol in light, interactive coral in dark. -->
  <style>
    .track { stroke: #b3b3be; }
    .live  { stroke: #009999; }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #4c4c68; }
      .live  { stroke: #00cccc; }
    }
  </style>
  <g fill="none" stroke-width="6">
    <circle class="track" cx="16" cy="16" r="10.5"
            stroke-dasharray="9 1.9955" transform="rotate(-90 16 16)"/>
    <path class="live" d="M16 5.5 A10.5 10.5 0 0 1 23.94 9.13"/>
  </g>
</svg>
