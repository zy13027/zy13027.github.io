ody Control",intro:"SONIC learns one whole-body controller by tracking a large library of movements in simulation. Give it a reference and the robot\u2019s sensed state, and it continually produces joint targets for the Unitree G1.",metrics:[["100M+","training frames"],["42M","largest controller"],["50 Hz","joint-target inference"]],experiment:"Follow one movement through the controller",labTitle:"What the joint controller does with a target",labLink:"Joint control",examples:[{name:"Gamepad",route:"Kinematic planner \u2192 robot encoder",description:"A navigation command goes to a kinematic planner. The robot encoder sees future G1 joint positions and velocities. The robot walks in this illustration."},{name:"Whole-body VR",route:"Full-body human pose \u2192 human encoder",description:"Full-body virtual reality teleoperation estimates human motion in SMPL (Skinned Multi-Person Linear model) format. The human encoder reads future 3D human joint positions. The robot squats in this illustration."},{name:"Three-point VR",route:"Head + wrists and planned legs \u2192 hybrid encoder",description:"A headset and two controllers give current head and wrist targets. The kinematic planner supplies future lower-body motion. The hybrid encoder joins these into a motion command."}],steps:[["Reference","Specify the intended movement","A short window of reference poses lets the controller anticipate a step or a change in posture. The source can be a planner, a recorded clip or a live human-motion stream."],["Encode","Choose the encoder for the input","Three multilayer perceptrons handle robot, human and hybrid commands. Each maps its input to the same latent space, a learned numerical representation of motion."],["Quantise","Map each component onto a fixed grid","Finite Scalar Quantisation (FSQ) rounds each coordinate to an allowed level. The default uses two 32-dimensional tokens with 32 levels per coordinate. Together they supply a 64-dimensional motion representation."],["Decode","Combine the token with robot feedback","The control decoder uses a 10-step history of joint positions and velocities, root angular velocity, the gravity direction in the root frame and previous actions. It computes desired joint positions at 50 Hz."],["Track","Send the latest target to the robot","The command writer publishes the latest targets at 500 Hz. Built-in joint proportional\u2013derivative (PD) controllers drive the motors. The policy reads the changed robot state on its next tick."]],chapters:[["Motion capture and retargeting","The source collection contains about 700 hours of human motion. The team uses General Motion Retargeting (GMR) and PyRoki to fit motions to G1 anatomy, then filters motions judged implausible for that robot. The training split contains 611 hours across 33 main categories. A reference gives desired poses frame by frame. Simulated physics reveals what the robot actually does.","\xA73.1 and Table 2"],["Training the feedback policy","In Isaac Lab, Proximal Policy Optimisation (PPO) improves the policy using simulated rollouts. Rewards encourage tracking body positions, orientations and velocities and reaching key points such as wrists and ankles. Penalties discourage shake and abrupt foot motion. Training varies parameters such as friction and centre of mass and applies simulated pushes. The actor uses deployable observations. The training critic also sees privileged simulator state.","\xA73.2, Tables S2\u2013S4"],["Why the encoders share a token space","The authors train with four losses. PPO rewards executable tracking. Reconstruction uses an auxiliary motion decoder to recover the robot reference from each token. Token alignment pulls together representations of the same motion from different encoders. Cycle consistency checks that a human token decoded into a robot reference and re-encoded stays close to the original robot token. Straight-through gradients let training update the encoders through FSQ.","\xA73.2, \xA73.6, Figs. 7\u20138"],["Planning a movement and tracking it","The optional kinematic planner filters high-level navigation commands with a critically damped spring and fills in between selected keyframes using masked motion-token prediction. It proposes 0.8\u20132.4 s segments and can update at 10 Hz or on a command change. The independent 50 Hz tracker handles physical execution. Operator input is sampled at 100 Hz, and the writer publishes motor targets at 500 Hz. The paper reports 1\u20132 ms policy inference and 12 ms motion generation on Jetson Orin.","\xA72.2, \xA73.3, \xA73.5 and \xA7S7"],["Connecting vision and language to whole-body motion","For the whole-body tasks in this paper, a fine-tuned GR00T N1.5 vision-language-action (VLA) model produces a 78-dimensional action with 64 motion-token coordinates and 14 hand-joint values. The token drives SONIC\u2019s control decoder. The apple-to-plate demonstration instead uses the three-point interface. An upstream system can also estimate or generate human motion from video, text or music and feed the human encoder.","\xA72.3\u2013\xA72.5 and Table 1"],["Reading the limits","Test-content holds out motion categories. Test-repetition holds out new takes of familiar types. Clip success checks height and orientation deviations (0.25 m and 1 rad in the stated protocol), while local mean per-joint position error (MPJPE-L) measures root-relative pose accuracy. The paper\u2019s MuJoCo baseline comparison uses different training datasets and retargeting pipelines. The hardware results cover the tested motions and G1 setup. On the 123-clip real-world evaluation, the feet had a much larger sim-to-real error gap than the upper body.","\xA72.1, Fig. 2 and \xA7S2\u2013S4"]],results:[{name:"Simulation scaling",context:"Isaac Lab \u2022 held-out motion categories \u2022 Figure 2",rows:[["1.2M parameter policy",98],["42M parameter policy",99.6]],note:"Root-relative pose error improved from 27.7 to 23.8 mm. The paper also varies data (4M to 100M frames) and training compute (about 2k to 21k GPU-hours) in separate sweeps."},{name:"Hardware tracking",context:"123 motion sequences \u2022 simulation versus real Unitree G1 \u2022 Figure 2",rows:[["Simulation",100],["Real G1",99.2]],note:"MPJPE-L was 22.3 mm in simulation and 25.7 mm on the real robot. Foot error was 29.0 mm in simulation and 53.7 mm on hardware."},{name:"VLA tasks",context:"Physical task success \u2022 Table 1",rows:[["Apple to plate",90],["Carrot pickup",75],["Scrub pickup",95],["Open bin by pedal",70],["Soda can into bin",60],["Drill and box relocation",70]],note:"Strict binary outcomes, 10\u201320 trials per row. The carrot and scrub variants share one policy and count as one task in the reported five-task average of 75%."}],sources:[["Paper matching the attached draft",Cm],["NVIDIA project demos","https://nvlabs.github.io/GEAR-SONIC/"],["Whole-body control code","https://github.com/NVlabs/GR00T-WholeBodyControl"]]},Td={name:"GR00T N1",title:"From a camera image to robot action",full:"An Open Foundation Model for Generalist Humanoid Robots",intro:"GR00T N1 is a vision-language-action model. It encodes what the robot sees and what it has been asked to do, then uses those features and its sensed state to generate a short sequence of actions.",metrics:[["2.2B","released model parameters"],["16","action vectors per chunk"],["4","flow-matching inference steps"]],experiment:"Follow an instruction through both systems",labTitle:"How an action chunk changes at each inference step",labLink:"Action sampling",examples:[{name:"Apple \u2192 shelf",route:"Camera + \u201CPut the apple on the lower shelf.\u201D",description:"The apple starts on the robot\u2019s left. A bimanual handover brings it within reach of the right hand for placement, as in the paper\u2019s coordination example."},{name:"Apple \u2192 basket",route:"Camera + \u201CPut the apple in the basket.\u201D",description:"The visual scene is held fixed. Changing the instruction changes the destination. The illustration follows the right hand from the handover towards the basket."}],steps:[["Observe","Read the camera, instruction and robot state","The vision-language backbone receives one or more images and a text instruction. The state encoder takes the robot\u2019s proprioceptive readings, such as positions of its arm and hand joints."],["System 2","Build vision-and-language features","Eagle-2 combines image embeddings and text. GR00T-N1-2B uses the language model\u2019s layer-12 representations as conditioning features for the action module."],["System 1","Start with a noisy action chunk","Sample a chunk of 16 continuous action vectors from Gaussian noise. State and noised-action inputs go through embodiment-specific projection networks into the shared Diffusion Transformer (DiT)."],["Flow updates","Refine the whole chunk four times","The DiT alternates self-attention on state and action embeddings with cross-attention to image and text features. The embodiment-specific action decoder predicts a vector field, and numerical integration updates the chunk."],["Execute","Apply actions and observe the changed scene","The final chunk represents 16 future robot timesteps. After the selected actions execute, a new observation can condition another prediction. The animation compresses a multi-chunk task into one teaching sequence."]],chapters:[["System 2 and System 1","System 2 is the pretrained Eagle-2 vision-language model (VLM). Its SigLIP-2 image encoder produces 64 image embeddings per 224 \xD7 224 frame after spatial rearrangement. Image embeddings and text are mixed by a language backbone based on SmolLM2. System 1 conditions on hidden features, so it can generate actions without waiting for a written plan. The attached version keeps the language component frozen during policy training and fine-tunes the other components as described in \xA72.3.","\xA72.1\u2013\xA72.3 and Figs. 2\u20133"],["Embodiment and action spaces","An embodiment is a particular agent body and its observation and command conventions. A single arm, a dual-arm humanoid and a video pseudo-embodiment have different input and output dimensions. Each uses separate state and action encoders plus an action decoder. These small multilayer perceptrons project to and from a hidden dimension shared by the DiT. Adapting to a robot requires specifying its state and action representation and training with applicable data.","\xA72.1, Fig. 3 and \xA74"],["Flow matching and the two clocks","In training, sample a Gaussian noise chunk and interpolate between it and a demonstration action chunk. Teach the model the vector field along that interpolation. At inference, start from noise and apply four forward Euler updates in the paper\u2019s implementation. An inference step updates every position of the chunk. A robot timestep is a future point at which one generated command can execute. The paper reports 63.9 ms to sample a 16-vector chunk on an NVIDIA L40 using bfloat16 (bf16).","\xA72 and \xA72.1, Eq. 1"],["The data pyramid","Real teleoperation and open robot datasets provide hardware-specific actions. DexMimicGen transforms demonstration segments around new object poses and validates replay in a physics simulator. The authors also generate 827 hours of synthetic video from a pipeline trained on 88 hours of teleoperation, varying instructions from starting frames. Those videos give visual diversity and need action labels before policy training.","\xA72.2\u2013\xA73.3, Fig. 1 and Table 7"],["How video becomes training data","A vector-quantised variational autoencoder (VQ-VAE) learns to reconstruct a future image from a starting image and a compact latent change. The continuous pre-quantisation embedding becomes the latent action pseudo-label. The paper treats this Latent Action Pre-training for general Action models (LAPA) pathway as a separate embodiment. A robot-specific inverse dynamics model (IDM) is another option for synthetic videos where robot-labelled data are available. It estimates what actions could have produced the observed transition.","\xA72.2\u2013\xA72.3 and \xA74.4"],["Pre-training, post-training and transfer","Pre-training fits the same flow-matching objective across a mixture of labelled and pseudo-labelled bodies and datasets. Post-training fine-tunes for one embodiment and its tasks. The paper\u2019s qualitative bimanual example shows that a pretrained checkpoint can hand off an object, while a checkpoint fine-tuned on right-hand-only data fails in that setup. The reported evaluation focuses mainly on short-horizon tabletop manipulation, with long-horizon loco-manipulation listed as future work in this version.","\xA72.3 and \xA74.5\u2013\xA74.6"]],results:[{name:"Simulation",context:"Average across three benchmarks \u2022 100 demonstrations per task \u2022 Table 2",rows:[["Behaviour-cloning Transformer",26.4],["Diffusion Policy",33.4],["GR00T N1-2B",45]],note:"The benchmarks are RoboCasa, DexMG and simulated GR-1 manipulation. GR00T\u2019s reported GR-1 result was 50.0%, compared with 32.7% for Diffusion Policy."},{name:"Real GR-1",context:"Four physical task categories \u2022 Table 3",rows:[["Diffusion Policy \xB7 10% data",10.2],["GR00T N1-2B \xB7 10% data",42.6],["Diffusion Policy \xB7 full data",46.4],["GR00T N1-2B \xB7 full data",76.8]],note:"Percentages describe the paper\u2019s task suite and data splits on the Fourier GR-1. The 10% and full settings refer to post-training data."},{name:"Pretrained checkpoint",context:"Two physical evaluations \u2022 \xA74.4",rows:[["Coordinated shelf placement",76.6],["Novel object / unseen container",73.3]],note:"Five objects and three trials per object in each setting. The stated protocol counts some successful grasps with failed placements as half credit."}],sources:[["Paper v2 (attached edition)",Em],["NVIDIA research publication","https://research.nvidia.com/publication/2025-03_nvidia-isaac-gr00t-n1-open-foundation-model-humanoid-robots"],["Released N1-2
