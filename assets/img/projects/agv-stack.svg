<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-labelledby="t d">
  <title id="t">Differential-drive AGV navigation stack — architecture</title>
  <desc id="d">Gazebo Harmonic simulation: wheel feedback and IMU feed the planar EKF; LiDAR supports SLAM Toolbox or AMCL and costmaps. Nav2 sends TwistStamped commands through Collision Monitor and the health supervisor to diff_drive_controller, then through gz_ros2_control's simulated joint interface to the wheel joints.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .cap { font-size: 15px; fill: #64748b; letter-spacing: .08em; }
      .lbl { font-size: 21px; fill: #1e293b; }
      .sub { font-size: 15px; fill: #64748b; }
      .box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .key { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; rx: 8; }
      .flow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flowk { stroke: #0f766e; stroke-width: 2.2; fill: none; marker-end: url(#arrowk); }
      .fb { stroke: #b45309; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowa); }
      .tf { font-size: 14px; fill: #0f766e; }
      .sim { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 6; rx: 12; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e2e8f0; }
        .cap, .sub { fill: #94a3b8; }
        .lbl { fill: #f1f5f9; }
        .box { fill: #1e293b; stroke: #334155; }
        .key { fill: #134e4a; stroke: #2dd4bf; }
        .flow { stroke: #64748b; }
        .flowk, .tf { stroke: #2dd4bf; }
        .tf { fill: #2dd4bf; }
        .sim { stroke: #475569; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrowk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arrowa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>

  <!-- header -->
  <text x="60" y="52" class="cap">AGV NAVIGATION STACK · ROS 2 JAZZY</text>
  <text x="1140" y="52" class="cap" text-anchor="end">SIMULATION · OCT 2026</text>

  <!-- simulated sensor group -->
  <rect x="60" y="92" width="1080" height="118" class="sim"/>
  <text x="80" y="118" class="cap">SIMULATED IN GAZEBO HARMONIC</text>

  <g transform="translate(110,136)">
    <rect width="260" height="56" class="box"/>
    <text x="130" y="35" class="lbl" text-anchor="middle">wheel encoders</text>
  </g>
  <g transform="translate(470,136)">
    <rect width="260" height="56" class="box"/>
    <text x="130" y="35" class="lbl" text-anchor="middle">IMU</text>
  </g>
  <g transform="translate(830,136)">
    <rect width="260" height="56" class="box"/>
    <text x="130" y="35" class="lbl" text-anchor="middle">2D LiDAR</text>
  </g>

  <!-- state estimation row -->
  <g transform="translate(110,290)">
    <rect width="620" height="72" class="key"/>
    <text x="310" y="31" class="lbl" text-anchor="middle">EKF · robot_localization</text>
    <text x="310" y="55" class="sub" text-anchor="middle">fuses odometry + IMU → odom → base_link</text>
  </g>
  <g transform="translate(830,290)">
    <rect width="260" height="72" class="box"/>
    <text x="130" y="31" class="lbl" text-anchor="middle" style="font-size:18px">SLAM Toolbox / AMCL</text>
    <text x="130" y="55" class="sub" text-anchor="middle">map → odom</text>
  </g>

  <!-- sensors → estimation -->
  <path d="M240,192 V290" class="flow"/>
  <path d="M600,192 V290" class="flow"/>
  <path d="M960,192 V290" class="flow"/>

  <!-- costmaps -->
  <g transform="translate(330,442)">
    <rect width="540" height="72" class="box"/>
    <text x="270" y="31" class="lbl" text-anchor="middle">costmaps · global + local</text>
    <text x="270" y="55" class="sub" text-anchor="middle">occupancy from LiDAR · inflation · TF from both estimators</text>
  </g>
  <path d="M420,362 V442" class="flow"/>
  <path d="M960,362 V402 H780 V442" class="flow"/>
  <text x="440" y="392" class="tf">odom → base_link</text>
  <text x="975" y="392" class="tf">map → odom</text>

  <!-- nav2 row -->
  <text x="60" y="580" class="cap">NAV2</text>
  <g transform="translate(110,596)">
    <rect width="300" height="84" class="key"/>
    <text x="150" y="33" class="lbl" text-anchor="middle">planner server</text>
    <text x="150" y="58" class="sub" text-anchor="middle">NavFn · global path</text>
  </g>
  <g transform="translate(450,596)">
    <rect width="300" height="84" class="key"/>
    <text x="150" y="33" class="lbl" text-anchor="middle">controller server</text>
    <text x="150" y="58" class="sub" text-anchor="middle">RPP → stamped commands</text>
  </g>
  <g transform="translate(790,596)">
    <rect width="300" height="84" class="key"/>
    <text x="150" y="33" class="lbl" text-anchor="middle">behaviour server</text>
    <text x="150" y="58" class="sub" text-anchor="middle">recoveries · spin · back up</text>
  </g>
  <!-- costmaps → nav2 -->
  <path d="M600,514 V556 H260 V596" class="flow"/>
  <path d="M600,514 V596" class="flow"/>
  <path d="M600,514 V556 H940 V596" class="flow"/>
  <!-- planner → controller -->
  <path d="M410,638 H450" class="flowk"/>

  <!-- stamped command checks -->
  <g transform="translate(110,714)">
    <rect width="460" height="56" class="key"/>
    <text x="230" y="23" class="lbl" text-anchor="middle">Collision Monitor</text>
    <text x="230" y="46" class="sub" text-anchor="middle">/cmd_vel_nav → /cmd_vel_checked</text>
  </g>
  <g transform="translate(630,714)">
    <rect width="460" height="56" class="key"/>
    <text x="230" y="23" class="lbl" text-anchor="middle">health supervisor</text>
    <text x="230" y="46" class="sub" text-anchor="middle">→ /base_controller/cmd_vel</text>
  </g>
  <path d="M600,680 V698 H340 V714" class="flowk"/>
  <path d="M940,680 V688 H600 V698" class="flowk"/>
  <path d="M570,742 H630" class="flowk"/>

  <!-- ros2_control row -->
  <text x="60" y="804" class="cap">ROS2_CONTROL · TWISTSTAMPED INPUT</text>
  <g transform="translate(110,820)">
    <rect width="400" height="72" class="box"/>
    <text x="200" y="31" class="lbl" text-anchor="middle">diff_drive_controller</text>
    <text x="200" y="55" class="sub" text-anchor="middle">stamped command → wheel velocities</text>
  </g>
  <g transform="translate(550,820)">
    <rect width="300" height="72" class="box"/>
    <text x="150" y="31" class="lbl" text-anchor="middle" style="font-size:18px">simulated joint interface</text>
    <text x="150" y="55" class="sub" text-anchor="middle">gz_ros2_control</text>
  </g>
  <g transform="translate(890,820)">
    <rect width="200" height="72" class="box"/>
    <text x="100" y="31" class="lbl" text-anchor="middle">wheel joints</text>
    <text x="100" y="55" class="sub" text-anchor="middle">L · R</text>
  </g>
  <!-- controller → ros2_control chain -->
  <path d="M860,770 V786 H510 V812 H310 V820" class="flowk"/>
  <path d="M510,856 H550" class="flow"/>
  <path d="M850,856 H890" class="flow"/>

  <!-- encoder feedback loop -->
  <path d="M1090,856 H1168 V76 H240 V136" class="fb"/>
  <text x="1178" y="470" class="sub" transform="rotate(90 1178 470)" text-anchor="middle">joint states → odometry (feedback)</text>

  <!-- footer -->
  <text x="60" y="930" class="sub">Simulation only · stamped command checks · wheel-joint feedback · GUI/GPU and native Ubuntu unverified.</text>
</svg>
