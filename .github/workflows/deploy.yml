name: Build and deploy to GitHub Pages

# Mirrors al-folio v1's own build recipe (Ruby + Node/Tailwind + Python/nbconvert),
# then publishes through GitHub Pages' artifact deploy rather than a gh-pages branch.
#
# The China half is NOT deployed from here yet — that job gets added once
# ICP 备案 clears and an SSH deploy key is in place. Until the filing is
# approved, nothing may legally serve from the mainland host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      # al-folio v1 builds its stylesheet with Tailwind via Node at build time
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      # jekyll-jupyter-notebook (in the Gemfile) shells out to nbconvert
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Verify build output
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html missing"; exit 1; }
          echo "Built $(find _site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
