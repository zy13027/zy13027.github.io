name: Build and deploy to GitHub Pages

# Builds the Jekyll site and publishes it to GitHub Pages.
#
# The China half (阿里云 ECS, 101.200.176.111) is NOT deployed from here yet —
# that job gets added once ICP 备案 clears and an SSH deploy key is in place.
# Until the filing is approved, nothing may legally serve on that server.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # al-folio uses imagemagick for responsive image generation
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify build output
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html missing"; exit 1; }
          echo "Built $(find _site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
