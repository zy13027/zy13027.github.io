name: Build and deploy to GitHub Pages

# Mirrors al-folio v1's own build recipe (Ruby + Node/Tailwind + Python/nbconvert),
# then publishes through GitHub Pages' artifact deploy rather than a gh-pages branch.
#
# The China half is NOT deployed from here yet — that job gets added once
# ICP 备案 clears and an SSH deploy key is in place. Until the filing is
# approved, nothing may legally serve from the mainland host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      # al-folio v1 builds its stylesheet with Tailwind via Node at build time
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      # jekyll-jupyter-notebook (in the Gemfile) shells out to nbconvert
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Verify build output
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html missing"; exit 1; }
          echo "Built $(find _site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------------------
  # China half: rsync the same build to the 阿里云 ECS over SSH.
  # Runs in parallel with the GitHub Pages deploy, from the same artefact.
  # Needs three repository secrets: ECS_HOST, ECS_USER, ECS_SSH_KEY.
  # -------------------------------------------------------------------------
  deploy-ecs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact

      - name: Unpack
        run: |
          mkdir -p _site
          tar -xf pages-artifact/artifact.tar -C _site
          test -f _site/index.html || { echo "::error::unpacked site has no index.html"; exit 1; }

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # --chmod forces world-readable files regardless of the server's umask,
      # which on this 等保 image is 027 and would otherwise 404 every page.
      - name: rsync to ECS
        run: |
          rsync -az --delete \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            _site/ "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/zinanyang/"

      - name: Verify
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://${{ secrets.ECS_HOST }}/" || echo "000")
          echo "ECS responded HTTP $code"
          test "$code" = "200" || echo "::warning::ECS returned $code — is port 80 open in the security group?"
